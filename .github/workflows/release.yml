name: BZ-Code macOS release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional X.Y.Z override; defaults to the next BZ-Code patch"
        type: string
        required: false
      publish:
        description: "Approve publication to the BZ-Code GitHub Releases feed"
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bz-code-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'BryanZaneee/b3code' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'bz/upstream-sync'))
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BZ_PUBLISH: ${{ github.event_name == 'pull_request' || inputs.publish }}
      BZ_RELEASE_VERSION: ${{ inputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: BryanZaneee/b3code
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
      - name: Select version and skip unchanged sources
        id: version
        run: node scripts/bz-release-version.mjs
      - name: Validate and build
        if: steps.version.outputs.skip != 'true'
        run: |
          vp i --frozen-lockfile
          vp run icons:check
          node --test scripts/bz-release-version.test.mjs
          vp test run apps/desktop/src/app/DesktopEnvironment.test.ts apps/desktop/src/app/DesktopAppIdentity.test.ts apps/desktop/src/app/DesktopUserData.test.ts apps/desktop/src/electron/ElectronProtocol.test.ts apps/desktop/src/updates/DesktopUpdates.test.ts apps/desktop/src/updates/updateMachine.test.ts apps/server/src/desktopUpdate/DesktopAppUpdate.test.ts apps/server/src/cloud/selfUpdate.test.ts apps/web/src/components/desktopUpdate.logic.test.ts
          vp run --filter @t3tools/desktop --filter @t3tools/web --filter @t3tools/scripts --filter t3 typecheck
          vp run build:desktop
      - name: Package Apple Silicon app
        if: steps.version.outputs.skip != 'true'
        id: package
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=(--platform mac --target dmg --arch arm64 --build-version "$BUILD_VERSION" --skip-build --keep-stage)
          configured=0
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -n "${!key}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" == 5 ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            chmod 600 "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
            export BZ_VERIFY_SIGNED=true
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [[ "$configured" != 0 ]]; then
            echo '::error::Signing credentials are incomplete; refusing a silently unsigned release.'
            exit 1
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Unsigned build: automatic installation is not validated or supported.'
          fi
          vp run dist:desktop:artifact "${args[@]}"
          test -s "release/BZ-Code-${BUILD_VERSION}-arm64.dmg"
          test -s "release/BZ-Code-${BUILD_VERSION}-arm64.zip"
          test -s release/latest-mac.yml
          test -s "release/BZ-Code-${BUILD_VERSION}-arm64.dmg.blockmap"
          test -s "release/BZ-Code-${BUILD_VERSION}-arm64.zip.blockmap"
          node scripts/bz-verify-release.mjs release "$BUILD_VERSION"
      - name: Preserve installable artifacts
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BZ-Code-macos-arm64-${{ steps.version.outputs.version }}
          path: |
            release/BZ-Code-*.dmg
            release/BZ-Code-*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
      - name: Publish approved release
        if: steps.version.outputs.skip != 'true' && env.BZ_PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.package.outputs.signed }}
        run: |
          tag="v$VERSION"
          args=("$tag" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "BZ-Code $VERSION" --draft)
          if [[ "$SIGNED" != true ]]; then
            args+=(--prerelease --notes 'Unsigned personal build. Install manually. Automatic installation requires a Developer ID signed release and an end-to-end update test.')
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}" release/BZ-Code-*.dmg release/BZ-Code-*.zip release/*.blockmap release/latest-mac.yml
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir "$RUNNER_TEMP/published-update"
          cmp release/latest-mac.yml "$RUNNER_TEMP/published-update/latest-mac.yml"
          if [[ "$SIGNED" == true ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$tag"
          fi
