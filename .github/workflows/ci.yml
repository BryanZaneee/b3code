name: BZ-Code validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bz-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
      - run: vp i --frozen-lockfile
      - run: vp run icons:check
      - run: node --test scripts/bz-release-version.test.mjs scripts/bz-verify-release.test.mjs
      - run: vp test run apps/desktop/src/app/DesktopEnvironment.test.ts apps/desktop/src/app/DesktopUserData.test.ts apps/desktop/src/app/DesktopAppIdentity.test.ts apps/desktop/src/electron/ElectronProtocol.test.ts apps/desktop/src/updates/DesktopUpdates.test.ts apps/desktop/src/updates/updateMachine.test.ts apps/server/src/desktopUpdate/DesktopAppUpdate.test.ts apps/server/src/cloud/selfUpdate.test.ts apps/web/src/branding.test.ts apps/web/src/components/desktopUpdate.logic.test.ts scripts/build-desktop-artifact.test.ts packages/shared/src/codexAuthHandoff.test.ts
      - run: vp run --filter @t3tools/desktop --filter @t3tools/web --filter @t3tools/scripts --filter t3 typecheck
      - run: vp run build:desktop
